# PostgreSQL for the primary database. The Rails 8 Solid stack
# (cache/queue/cable) stays on SQLite — see docs/adr/0001-postgres-and-docker-dev.md.
#
# Connection is driven by env vars so the same config works in Docker
# (host "db") and on a host machine, defaulting to the docker-compose "db" service.
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "db") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "vin_lookup_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "vin_lookup_test") %>

# Primary moves to Postgres; the Solid databases remain SQLite (see ADR 0001).
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DATABASE_NAME", "vin_lookup_production") %>
  cache:
    adapter: sqlite3
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    adapter: sqlite3
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
